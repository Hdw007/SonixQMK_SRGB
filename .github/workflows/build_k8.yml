name: Build Keychron K8 ISO SignalRGB
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sn32_develop
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pip
          # Wir installieren die QMK CLI, damit 'make' sie finden kann
          pip3 install qmk

      - name: QMK Setup
        run: |
          # Das verknüpft die CLI mit dem aktuellen Ordner
          qmk setup -y

      - name: Initialize Submodules
        run: |
          # Jetzt sollte 'make git-submodule' funktionieren
          make git-submodule

      - name: Build Firmware
        run: |
          # Dein Befehl für das K8 ISO
          make keychron/k8/rgb/iso:iso

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k8_iso_srgb
          path: |
            *.bin
            *.hex
            .build/*.bin
            .build/*.hex
