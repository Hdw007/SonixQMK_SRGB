name: Build Keychron K8 ISO SignalRGB
on: [workflow_dispatch]

jobs:
  build:
    # Wir nutzen den stabilen 22.04 Runner
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sn32_develop
          submodules: recursive

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Build Firmware (Bypass Python)
        run: |
          # Wir nutzen QMK_BIN=true und SKIP_PYTHON=yes, 
          # damit der Server nicht wegen der alten Skripte abstürzt.
          make keychron/k8/rgb/iso:iso QMK_BIN=true SKIP_PYTHON=yes SKIP_GIT=yes

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k8_iso_srgb
          path: |
            *.bin
            *.hex
            .build/*.bin
            .build/*.hex
