name: Build Keychron K8 ISO SignalRGB
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sn32_develop
          submodules: recursive

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Initialize Sonix Submodules
        run: |
          # Speziell für den Sonix-Fork wichtig:
          git submodule update --init --recursive
          make git-submodule

      - name: Build Firmware
        run: |
          # Dein vorgeschlagener Befehl:
          make keychron/k8/rgb/iso:iso

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k8_iso_srgb
          path: |
            *.bin
            *.hex
            .build/*.bin
            .build/*.hex
