name: Build Keychron K8 ISO SignalRGB
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sn32_develop
          submodules: recursive

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3-pip
          python3 -m pip install qmk

      - name: Build Firmware
        run: |
          # Basierend auf deiner Pfadangabe:
          # Keyboard ist 'keychron/k8/rgb'
          # Keymap Ordner ist 'iso'
          qmk compile -kb keychron/k8/rgb -km iso

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: keychron_k8_iso_srgb
          path: |
            *.bin
            *.hex
            .build/*.bin
            .build/*.hex
